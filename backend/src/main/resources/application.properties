server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:spendwise;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.h2.console.enabled=true
jwt.secret=${JWT_SECRET:spendwise-super-secret-key-change-me-min-32-chars}
jwt.expiration=86400000
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
