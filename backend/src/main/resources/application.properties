# ─── Server ────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=spendwise-backend

# ─── Local dev default: H2 in-memory ──────────────────────
# On Render, these are overridden by SPRING_DATASOURCE_* env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:spendwise;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── H2 console (local dev only) ──────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JWT ──────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:spendwise-super-secret-key-change-me-minimum-32-chars-long}
jwt.expiration=86400000

# ─── CORS ─────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never